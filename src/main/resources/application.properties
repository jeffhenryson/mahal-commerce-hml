spring.application.name=mahal-commerce

# Multipart — o teto acompanha o MAIOR upload aceito, hoje a imagem de produto (5 MB), não mais
# o avatar (2 MB). Fica ligeiramente acima para absorver o overhead do boundary do multipart.
# Abaixo disso o Tomcat corta a requisição antes de o controller rodar, e o cliente recebe um erro
# de container em vez do IMAGE_TOO_LARGE do domínio.
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:6MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:6MB}

# ATENÇÃO: o perfil padrão "dev" é permissivo (H2 aberto, CORS *, seed de usuários hardcoded).
# Em produção, defina SPRING_PROFILES_ACTIVE=prod via variável de ambiente.
# Deploy sem essa variável sobe em modo dev — NUNCA adequado para produção.
# Desde PLAT-C032 isso não é só um aviso: DevStartupValidator aborta o boot se o perfil dev
# for ativado sobre sinais de infraestrutura remota (DB_URL/CORS_ALLOWED_ORIGINS não-locais).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:hml}

# Cache — Caffeine: TTL 60 s, max 500 entradas por cache
# Caches usados: userDetails (CustomUserDetailsService), users (UserRepository), userAuthorities (JpaUserAuthoritiesAdapter)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60s

# CORS credentials — deve ser false quando allowed-origins='*' (dev); true com origem específica
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# OAuth2 — Google Client ID (obrigatório para validar ID tokens do frontend)
oauth2.google.client-id=${GOOGLE_CLIENT_ID:}

# HikariCP — valores base compartilhados por hml e prod (podem ser sobrescritos por perfil).
# Dimensionamento (C012): 10 é um ponto de partida conservador, não calibrado contra o
# hardware real do banco de produção — ajuste HIKARI_MAX_POOL_SIZE usando a fórmula
# ((núcleos_da_cpu_do_banco * 2) + spindle_count) documentada em docs/persistence.md
# ("Dimensionamento HikariCP x Tomcat") assim que o dimensionamento real da instância for
# conhecido. server.tomcat.threads.max é definido explicitamente em hml/prod (50, era o
# default implícito de 200) para manter uma proporção sã entre threads HTTP e conexões de banco.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

# Pool de threads dos jobs @Scheduled (C019) — sem isso, o default do Spring Boot é 1 thread,
# então jobs de limpeza com o mesmo horário (ex.: 3 deles às 03:45) executam em fila no mesmo
# thread em vez de em paralelo, atrasando uns aos outros. 4 threads cobre o maior grupo
# concorrente hoje (3 jobs às 03:45) com uma folga.
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:4}

# Swagger UI — lembra o Bearer token entre recargas (armazenado em localStorage do browser)
springdoc.swagger-ui.persist-authorization=true

# Não incluir endpoints do actuator no spec do Swagger — eles ficam em porta separada (hml/prod)
# e exigem DEV_ELEVATED em dev. Testá-los via Swagger causaria confusão.
springdoc.show-actuator=false

# Porta principal da aplicação
server.port=${PORT:8080}
avatar.base-url=${AVATAR_BASE_URL:http://localhost:${server.port}}
product.image.base-url=${PRODUCT_IMAGE_BASE_URL:http://localhost:${server.port}}

# Seed Dev User (controlado por variaveis de ambiente)
seed.dev.email=${DEV_EMAIL:}
seed.dev.password=${DEV_PASSWORD:Dev@secure1!}

# Webhook de automações do CRM (crm/webhook-disparo-real, F008) — URL é dinâmica por automação,
# por isso não há base-url aqui, só os timeouts do RestClient genérico.
crm.webhook.connect-timeout-ms=${CRM_WEBHOOK_CONNECT_TIMEOUT_MS:3000}
crm.webhook.read-timeout-ms=${CRM_WEBHOOK_READ_TIMEOUT_MS:5000}

# WhatsApp Cloud API (Configurações › Integrações). As credenciais (phone number id, tokens) moram
# cifradas em system_config; aqui só o que é do ambiente:
# - webhook-url: URL pública deste backend que a Meta chama (cadastrada no app da Meta);
# - app-secret: segredo do app da Meta, valida X-Hub-Signature-256 no webhook (vazio = recusa POSTs).
whatsapp.graph.base-url=${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com/v20.0}
whatsapp.connect-timeout-ms=${WHATSAPP_CONNECT_TIMEOUT_MS:3000}
whatsapp.read-timeout-ms=${WHATSAPP_READ_TIMEOUT_MS:5000}
whatsapp.status-cache-ttl=${WHATSAPP_STATUS_CACHE_TTL:5m}
whatsapp.webhook-url=${WHATSAPP_WEBHOOK_URL:http://localhost:${server.port}/webhooks/whatsapp}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
