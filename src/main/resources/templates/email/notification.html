<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: page(${email.title}, ${accent}, ~{::mailcontent})}">
<body>
<div th:fragment="mailcontent">
  <h2 th:style="${theme.title(accent)}" th:text="${email.title}">Título</h2>
  <p th:if="${email.intro}" th:text="${email.intro}">Introdução.</p>
  <th:block th:each="section : ${email.sections}">
    <h3 th:if="${section.title}" th:style="'margin:24px 0 8px;font-size:15px;color:' + ${theme.wine}" th:text="${section.title}">Seção</h3>
    <p th:if="${section.text}" style="margin:20px 0 0" th:text="${section.text}">Parágrafo.</p>
    <table th:if="${section.hasRows()}" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:14px">
      <tr th:each="row : ${section.rows}" th:style="'border-bottom:1px solid ' + ${theme.line}">
        <td th:style="'padding:8px 0;vertical-align:top;color:' + ${theme.muted}" th:text="${row.label}">Rótulo</td>
        <td th:style="${row.highlight} ? 'padding:8px 0 8px 12px;text-align:right;font-weight:bold;color:' + ${accent} : 'padding:8px 0 8px 12px;text-align:right;color:' + ${theme.text}"
            th:text="${row.value}">Valor</td>
      </tr>
    </table>
  </th:block>
  <th:block th:if="${actionUrl}">
    <table th:replace="~{email/components :: button(${actionUrl}, ${email.actionLabel} ?: 'Abrir no painel')}"></table>
  </th:block>
  <p th:if="${email.footnote}" th:style="${theme.note()}" th:text="${email.footnote}">Aviso.</p>
</div>
</body>
</html>
