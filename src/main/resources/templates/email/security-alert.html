<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: page('Aviso de segurança', ${accent}, ~{::mailcontent})}">
<body>
<div th:fragment="mailcontent">
  <h2 th:style="${theme.title()}" th:text="${title}">Título do alerta</h2>
  <p>Olá, <strong th:text="${username}">username</strong>!</p>
  <p th:text="${message}">Mensagem principal do alerta.</p>
  <table th:if="${occurredAt != null or ip != null or device != null}" role="presentation" width="100%"
         cellpadding="0" cellspacing="0" th:style="'margin:20px 0;border-radius:6px;font-size:14px;background:' + ${theme.surface}">
    <tr th:if="${occurredAt}">
      <td th:style="'padding:10px 16px;width:110px;color:' + ${theme.muted}">Quando</td>
      <td th:style="'padding:10px 16px;color:' + ${theme.text}" th:text="${occurredAt}">01/01/2026 às 10:00</td>
    </tr>
    <tr th:if="${ip}">
      <td th:style="'padding:10px 16px;color:' + ${theme.muted}">IP</td>
      <td th:style="'padding:10px 16px;color:' + ${theme.text}" th:text="${ip}">0.0.0.0</td>
    </tr>
    <tr th:if="${device}">
      <td th:style="'padding:10px 16px;color:' + ${theme.muted}">Aparelho</td>
      <td th:style="'padding:10px 16px;color:' + ${theme.text}" th:text="${device}">Chrome no Windows</td>
    </tr>
  </table>
  <div th:replace="~{email/components :: labeledCallout(${accent}, ${calloutLabel}, ${footerMessage})}"></div>
  <th:block th:if="${actionUrl}">
    <table th:replace="~{email/components :: button(${actionUrl}, ${actionLabel})}"></table>
  </th:block>
</div>
</body>
</html>
