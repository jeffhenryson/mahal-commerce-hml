<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: page(${email.title}, ${email.refund} ? ${theme.brand} : ${theme.danger}, ~{::mailcontent})}">
<body>
<div th:fragment="mailcontent">
  <h2 th:style="${theme.title()}" th:text="${email.title}">Pedido cancelado</h2>
  <p>Olá, <strong th:text="${order.firstName()}">cliente</strong>.</p>
  <p th:text="${email.body}">O que aconteceu com o pedido.</p>
  <div th:if="${email.hasCallout()}" th:style="${theme.callout(theme.caramel)}">
    <p th:each="detail : ${email.details}" th:style="'margin:0;font-size:14px;color:' + ${theme.text}">
      <strong th:text="${detail.label}">Rótulo:</strong> <span th:text="${detail.value}">Valor</span>
    </p>
  </div>
  <p th:if="${email.followUp}" th:text="${email.followUp}">O que acontece com o dinheiro.</p>
  <th:block th:with="totalLabel=${email.totalLabel}">
    <table th:replace="~{email/order-items :: table(${order})}"></table>
  </th:block>
  <th:block th:if="${actionUrl}">
    <table th:replace="~{email/components :: button(${actionUrl}, ${actionLabel})}"></table>
  </th:block>
  <p th:if="${store.phone}" th:style="${theme.note()}">
    Ficou com alguma dúvida? Fale com a loja: <span th:text="${store.phone}">telefone</span>.
  </p>
</div>
</body>
</html>
