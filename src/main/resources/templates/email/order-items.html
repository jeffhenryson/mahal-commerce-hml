<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<table th:fragment="table(order)" role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="border-collapse:collapse;margin:20px 0;font-size:14px">
  <tr th:style="'background:' + ${theme.surface}">
    <th th:style="'text-align:left;padding:10px 12px;font-weight:600;color:' + ${theme.muted}">Item</th>
    <th th:style="'text-align:center;padding:10px 8px;font-weight:600;color:' + ${theme.muted}">Qtd</th>
    <th th:style="'text-align:right;padding:10px 12px;font-weight:600;color:' + ${theme.muted}">Valor</th>
  </tr>
  <tr th:each="line : ${order.items}" th:style="'border-bottom:1px solid ' + ${theme.line}">
    <td th:style="'padding:10px 12px;color:' + ${theme.text}">
      <span th:text="${line.name}">Produto</span>
      <br th:if="${line.unitPrice}"><span th:if="${line.unitPrice}" th:style="'font-size:12px;color:' + ${theme.muted}"
            th:text="${#numbers.formatCurrency(line.unitPrice)} + ' cada'">R$ 0,00 cada</span>
    </td>
    <td th:style="'padding:10px 8px;text-align:center;color:' + ${theme.text}" th:text="${line.quantityLabel()}">1</td>
    <td th:style="'padding:10px 12px;text-align:right;white-space:nowrap;color:' + ${theme.text}"
        th:text="${line.amount != null} ? ${#numbers.formatCurrency(line.amount)} : '—'">R$ 0,00</td>
  </tr>
  <tr th:if="${order.hasValue(order.discountAmount)}">
    <td colspan="2" th:style="'padding:8px 12px;text-align:right;color:' + ${theme.muted}">Descontos</td>
    <td th:style="'padding:8px 12px;text-align:right;white-space:nowrap;color:' + ${theme.success}"
        th:text="'- ' + ${#numbers.formatCurrency(order.discountAmount)}">- R$ 0,00</td>
  </tr>
  <tr th:if="${order.hasValue(order.cashbackRedeemed)}">
    <td colspan="2" th:style="'padding:8px 12px;text-align:right;color:' + ${theme.muted}">Cashback usado</td>
    <td th:style="'padding:8px 12px;text-align:right;white-space:nowrap;color:' + ${theme.success}"
        th:text="'- ' + ${#numbers.formatCurrency(order.cashbackRedeemed)}">- R$ 0,00</td>
  </tr>
  <tr th:if="${order.hasValue(order.serviceFee)}">
    <td colspan="2" th:style="'padding:8px 12px;text-align:right;color:' + ${theme.muted}">Taxa de serviço</td>
    <td th:style="'padding:8px 12px;text-align:right;white-space:nowrap;color:' + ${theme.text}"
        th:text="${#numbers.formatCurrency(order.serviceFee)}">R$ 0,00</td>
  </tr>
  <tr th:if="${order.hasValue(order.deliveryFee)}">
    <td colspan="2" th:style="'padding:8px 12px;text-align:right;color:' + ${theme.muted}">Entrega</td>
    <td th:style="'padding:8px 12px;text-align:right;white-space:nowrap;color:' + ${theme.text}"
        th:text="${#numbers.formatCurrency(order.deliveryFee)}">R$ 0,00</td>
  </tr>
  <tr th:style="'border-top:2px solid ' + ${theme.caramel}">
    <td colspan="2" th:style="'padding:12px;text-align:right;font-weight:bold;color:' + ${theme.wine}"
        th:text="${totalLabel} ?: 'Total'">Total</td>
    <td th:style="'padding:12px;text-align:right;font-weight:bold;white-space:nowrap;color:' + ${theme.wine}"
        th:text="${#numbers.formatCurrency(order.total)}">R$ 0,00</td>
  </tr>
</table>
</body>
</html>
