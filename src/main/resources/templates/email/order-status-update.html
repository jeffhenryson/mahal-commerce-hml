<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: page('Atualização do pedido', '#1d4ed8', ~{::mailcontent})}">
<body>
<div th:fragment="mailcontent">
  <h2 style="margin:0 0 16px;color:#1d4ed8" th:text="${newStatusLabel}">Status atualizado</h2>
  <p>Olá, <strong th:text="${order.customerName}">cliente</strong>!</p>
  <p>Seu pedido <strong th:text="${order.orderReference}">#123</strong> teve o status atualizado para
    <strong th:text="${newStatusLabel}">status</strong>.</p>
  <table th:replace="~{email/order-items :: table(${order})}"></table>
</div>
</body>
</html>
