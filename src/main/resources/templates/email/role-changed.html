<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: page('Papel da conta alterado', '#1e40af', ~{::mailcontent})}">
<body>
<div th:fragment="mailcontent">
  <h2 style="margin:0 0 16px;color:#111" th:text="${title}">Papel atribuído / removido</h2>
  <p>Olá, <strong th:text="${username}">username</strong>!</p>
  <p th:text="${message}">O papel foi alterado na sua conta.</p>
  <p style="color:#777;font-size:.8rem;margin-top:20px">
    Se você não solicitou esta alteração, entre em contato com um administrador.
  </p>
</div>
</body>
</html>
