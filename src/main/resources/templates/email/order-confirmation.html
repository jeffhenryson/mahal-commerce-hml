<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: page('Pedido recebido', '#15803d', ~{::mailcontent})}">
<body>
<div th:fragment="mailcontent">
  <h2 style="margin:0 0 16px;color:#15803d">Recebemos seu pedido <span th:text="${order.orderReference}">#123</span></h2>
  <p>Olá, <strong th:text="${order.customerName}">cliente</strong>!</p>
  <p>Seu pedido foi registrado. Assim que o pagamento for confirmado, avisaremos por aqui.</p>
  <table th:replace="~{email/order-items :: table(${order})}"></table>
  <p th:if="${checkoutUrl}" style="text-align:center;margin:24px 0">
    <a th:href="${checkoutUrl}" style="background:#15803d;color:#fff;text-decoration:none;padding:12px 24px;border-radius:6px;display:inline-block;font-weight:bold">Concluir pagamento</a>
  </p>
</div>
</body>
</html>
