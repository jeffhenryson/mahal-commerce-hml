<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: page('Confirme seu e-mail', ${theme.brand}, ~{::mailcontent})}">
<body>
<div th:fragment="mailcontent">
  <h2 th:style="${theme.title()}">Confirme seu e-mail</h2>
  <p>E aí, <strong th:text="${username}">username</strong>!</p>
  <p>Falta só um clique para a gente confirmar que este e-mail é seu.</p>
  <table th:replace="~{email/components :: button(${verifyUrl}, 'Confirmar e-mail')}"></table>
  <p th:style="'margin:20px 0 8px;text-align:center;font-size:14px;color:' + ${theme.muted}">Se preferir, use este código na página de verificação:</p>
  <!--/* Monoespaçada e 22px: os 12 caracteres cabem numa linha no celular, e O não se confunde com 0. */-->
  <div th:text="${code}" th:style="'margin:8px 0;padding:14px 8px;border-radius:8px;text-align:center;font-family:Courier New,Courier,monospace;font-size:22px;font-weight:bold;letter-spacing:2px;background:' + ${theme.surface} + ';color:' + ${theme.wine}">
    000000000000
  </div>
  <p th:style="${theme.note()}">
    O link e o código valem por <span th:text="${ttlMinutes}">15</span> minutos. Se não foi você, é só ignorar este e-mail.
  </p>
</div>
</body>
</html>
