<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: page('Confirmação de cadastro', '#1e40af', ~{::mailcontent})}">
<body>
<div th:fragment="mailcontent">
  <h2 style="margin:0 0 16px;color:#111">Confirmação de cadastro</h2>
  <p>Olá, <strong th:text="${username}">username</strong>!</p>
  <p>Clique no botão abaixo para confirmar seu email e ativar sua conta:</p>
  <p style="text-align:center;margin:28px 0">
    <a th:href="${verifyUrl}" style="display:inline-block;background:#1e40af;color:#fff;padding:13px 32px;border-radius:6px;text-decoration:none;font-weight:bold;font-size:1rem">
      Confirmar email
    </a>
  </p>
  <p style="color:#555;font-size:.875rem;text-align:center">Ou insira o código manualmente na página de verificação:</p>
  <div th:text="${code}" style="font-size:1.75rem;font-weight:bold;letter-spacing:.4rem;background:#f4f4f4;padding:16px;text-align:center;border-radius:8px;margin:8px 0;color:#111">
    000000
  </div>
  <p style="color:#777;font-size:.8rem;margin-top:20px">
    Este código expira em <span th:text="${ttlMinutes}">15</span> minutos.<br>
    Se você não solicitou este cadastro, ignore este email.
  </p>
</div>
</body>
</html>
