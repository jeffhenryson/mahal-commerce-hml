<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="page(pageTitle, pageAccent, pageContent)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="${pageTitle}">Título</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:32px 16px">
  <tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)">
      <tr><td th:style="'background:#fff;padding:20px 32px;border-top:4px solid ' + ${pageAccent} + ';border-bottom:1px solid #eee'">
        <img th:if="${store.logoUrl}" th:src="${store.logoUrl}" th:alt="${store.name}" height="40"
             style="display:block;max-height:40px;border:0">
        <span th:unless="${store.logoUrl}" th:style="'color:' + ${pageAccent} + ';font-size:1.25rem;font-weight:bold'"
              th:text="${store.name}">Mahal</span>
      </td></tr>
      <tr><td style="padding:32px;color:#333;font-size:15px;line-height:1.5">
        <div th:replace="${pageContent}">conteúdo</div>
      </td></tr>
      <tr><td style="background:#f9f9f9;padding:16px 32px;border-top:1px solid #eee;text-align:center;color:#888;font-size:12px;line-height:1.6">
        <strong th:text="${store.name}">Mahal</strong>
        <span th:if="${store.address}"><br><span th:text="${store.address}">Endereço</span></span>
        <span th:if="${store.phone != null or store.instagram != null}"><br>
          <span th:if="${store.phone}" th:text="${store.phone}">telefone</span>
          <span th:if="${store.phone != null and store.instagram != null}"> · </span>
          <span th:if="${store.instagram}" th:text="${store.instagram}">@loja</span>
        </span>
        <span th:if="${store.website}"><br><a th:href="${store.website}" th:text="${store.website}" style="color:#888">site</a></span>
        <br><span style="color:#aaa">E-mail enviado automaticamente.</span>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
