<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="page(pageTitle, pageAccent, pageContent)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light only">
  <title th:text="${pageTitle}">Título</title>
</head>
<body th:style="'margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:' + ${theme.page}">
<div th:if="${preheader}" th:text="${preheader}"
     style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;font-size:1px;line-height:1px;mso-hide:all">Prévia</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" th:style="'padding:24px 12px;background:' + ${theme.page}">
  <tr><td align="center">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0"
           th:style="'width:100%;max-width:600px;border-radius:12px;overflow:hidden;background:' + ${theme.card}">
      <tr><td align="center" th:bgcolor="${theme.wine}" th:style="'padding:20px 32px;background:' + ${theme.wine}">
        <img th:if="${store.logoUrl}" th:src="${store.logoUrl}" th:alt="${store.name}" height="64"
             style="display:block;height:64px;max-height:64px;width:auto;border:0;margin:0 auto">
        <span th:unless="${store.logoUrl}" th:style="'font-size:22px;font-weight:bold;color:' + ${theme.cream}"
              th:text="${store.name}">Mahal</span>
      </td></tr>
      <tr th:with="strip=${pageAccent == theme.brand ? theme.caramel : pageAccent}">
        <td height="4" th:bgcolor="${strip}" th:style="'height:4px;font-size:0;line-height:0;background:' + ${strip}">&nbsp;</td>
      </tr>
      <tr><td th:style="'padding:32px;font-size:15px;line-height:1.55;color:' + ${theme.text}">
        <div th:replace="${pageContent}">conteúdo</div>
      </td></tr>
      <tr><td align="center" th:bgcolor="${theme.wine}"
              th:style="'padding:20px 32px;text-align:center;font-size:12px;line-height:1.6;background:' + ${theme.wine} + ';color:' + ${theme.cream}">
        <strong th:text="${store.name}">Mahal</strong>
        <span th:if="${store.address}"><br><span th:text="${store.address}">Endereço</span></span>
        <span th:if="${store.phone != null or store.instagram != null}"><br>
          <span th:if="${store.phone}" th:text="${store.phone}">telefone</span>
          <span th:if="${store.phone != null and store.instagram != null}"> · </span>
          <span th:if="${store.instagram}" th:text="${store.instagram}">@loja</span>
        </span>
        <span th:if="${store.website}"><br><a th:href="${store.website}" th:text="${store.website}" th:style="'color:' + ${theme.cream}">site</a></span>
        <br><span th:style="'color:' + ${theme.caramel}">E-mail enviado automaticamente.</span>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
