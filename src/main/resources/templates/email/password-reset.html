<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: page('Recuperação de senha', '#1e40af', ~{::mailcontent})}">
<body>
<div th:fragment="mailcontent">
  <h2 style="margin:0 0 16px;color:#111">Recuperação de senha</h2>
  <p>Olá, <strong th:text="${username}">username</strong>!</p>
  <p>Recebemos uma solicitação para redefinir a senha da sua conta.</p>
  <p style="text-align:center;margin:28px 0">
    <a th:href="${resetLink}" style="display:inline-block;background:#1e40af;color:#fff;padding:13px 32px;border-radius:6px;text-decoration:none;font-weight:bold;font-size:1rem">
      Redefinir senha
    </a>
  </p>
  <p style="color:#777;font-size:.8rem;margin-top:20px">
    Este link expira em <span th:text="${ttlMinutes}">15</span> minutos.<br>
    Se você não solicitou a recuperação de senha, ignore este email — sua senha permanece a mesma.
  </p>
</div>
</body>
</html>
