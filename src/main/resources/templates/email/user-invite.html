<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: page('Falta só criar sua senha', ${theme.brand}, ~{::mailcontent})}">
<body>
<div th:fragment="mailcontent">
  <h2 th:style="${theme.title()}">Falta só criar sua senha</h2>
  <p>E aí, <strong th:text="${username}">username</strong>!</p>
  <p>Você recebeu acesso ao painel da <strong th:text="${store.name}">loja</strong><th:block th:if="${roles}"> como <strong th:text="${roles}">Atendente</strong></th:block>. Seu usuário é <strong th:text="${username}">username</strong>.</p>
  <table th:replace="~{email/components :: button(${inviteLink}, 'Criar minha senha')}"></table>
  <p th:style="${theme.note()}">
    O link vale por <span th:text="${ttlHours}">48</span> horas. Se expirar, peça um novo convite a quem cuida dos acessos da loja.
  </p>
  <p th:style="${theme.note()}">Se você não esperava este convite, ignore este e-mail.</p>
</div>
</body>
</html>
