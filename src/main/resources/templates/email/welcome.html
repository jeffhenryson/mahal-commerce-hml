<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: page('Sua conta está pronta', ${theme.brand}, ~{::mailcontent})}">
<body>
<div th:fragment="mailcontent">
  <h2 th:style="${theme.title()}">Sua conta está pronta</h2>
  <p>E aí, <strong th:text="${username}">username</strong>!</p>
  <p>Criaram sua conta no painel da <span th:text="${store.name}">loja</span>. Entre com o usuário
    <strong th:text="${username}">username</strong> e a senha que a pessoa responsável passou para você.</p>
  <th:block th:if="${appUrl}">
    <table th:replace="~{email/components :: button(${appUrl}, 'Entrar no painel')}"></table>
  </th:block>
  <p th:style="${theme.note()}">Depois do primeiro acesso, troque a senha no seu perfil. Se você não esperava esta conta, fale com a loja.</p>
</div>
</body>
</html>
