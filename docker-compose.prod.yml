version: "3.9"

# =============================================================================
# Ambiente PROD — projeto compose: mahal-commerce-prod
# Stack de producao do Mahal Commerce — API, Admin UI e Market UI
#
#   docker compose -f docker-compose.prod.yml up -d
#
# RODA APENAS NA VPS. Não suba este arquivo na máquina de desenvolvimento: ele
# espera Traefik, os repositórios de frontend como diretórios sibling e um .env
# com segredos de produção distintos dos de dev/hml.
#
# TOTP_ENCRYPTION_KEY não tem mais fallback (PLAT-C028) — sem a variável no .env
# o compose falha, e o ProdStartupValidator rejeita as chaves já expostas no
# histórico do git mesmo que sejam recolocadas manualmente.
# =============================================================================

name: mahal-commerce-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-mahal-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-security}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-security}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis-mahal-prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  app:
    image: mahal-commerce-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-mahal-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-security}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-mahaltabacaria-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mahaltabacaria-ui}
      # Sem fallback: um default hardcoded aqui vira uma chave AES versionada no repositório
      # (PLAT-C028, regressão de C002). Gere com `openssl rand -base64 32` e defina no .env.
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      AVATAR_BASE_URL: ${AVATAR_BASE_URL:-https://mahaltabacaria.com.br}
      EMAIL_VERIFICATION_FRONTEND_URL: ${EMAIL_VERIFICATION_FRONTEND_URL:-https://mahaltabacaria.com.br/verify}
      EMAIL_APP_BASE_URL: ${EMAIL_APP_BASE_URL:-https://mahaltabacaria.com.br}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL: ${REDIS_SSL:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-60}
      LOGIN_RATE_MAX_REQUESTS: ${LOGIN_RATE_MAX_REQUESTS:-5}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:+UseG1GC
        -Djava.security.egd=file:/dev/./urandom
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      backend:
        aliases:
          - backend
      traefik-public:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.mahal-api.rule=Host(`api.mahaltabacaria.com.br`) || Host(`api.mahalcommerce.com`)"
      - "traefik.http.routers.mahal-api.entrypoints=websecure"
      - "traefik.http.routers.mahal-api.tls.certresolver=myresolver"
      - "traefik.http.services.mahal-api.loadbalancer.server.port=8082"

  mahal-commerce-ui:
    build:
      context: ./mahal-commerce-ui
      dockerfile: Dockerfile
    container_name: mahal-commerce-ui
    restart: unless-stopped
    ports:
      - "4201:80"
    networks:
      - backend
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.mahal-ui.rule=Host(`admin.mahaltabacaria.com.br`) || Host(`admin.mahalcommerce.com`)"
      - "traefik.http.routers.mahal-ui.entrypoints=websecure"
      - "traefik.http.routers.mahal-ui.tls.certresolver=myresolver"
      - "traefik.http.services.mahal-ui.loadbalancer.server.port=80"

  mahal-commerce-ui-market:
    build:
      context: ./mahal-commerce-ui-market
      dockerfile: Dockerfile
    container_name: mahalcommerce-marketplace
    restart: unless-stopped
    ports:
      - "4300:4000"
    environment:
      PORT: "4000"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-mahaltabacaria.com.br,www.mahaltabacaria.com.br}
    networks:
      - backend
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.mahal-market.rule=Host(`mahaltabacaria.com.br`) || Host(`www.mahaltabacaria.com.br`)"
      - "traefik.http.routers.mahal-market.entrypoints=websecure"
      - "traefik.http.routers.mahal-market.tls.certresolver=myresolver"
      - "traefik.http.services.mahal-market.loadbalancer.server.port=4000"

networks:
  backend:
    driver: bridge
  traefik-public:
    name: traefik-public
    external: true

volumes:
  pgdata_prod:
  redisdata_prod:
